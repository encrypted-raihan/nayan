name: NAYAN satellite integration

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Integrate satellite layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate satellite layer
        run: |
          npm install satellite.js@6.0.2 --save
          python3 - <<'PY'
          from pathlib import Path

          globe = Path('components/nayan-globe.tsx')
          text = globe.read_text()
          text = text.replace(
            'import { fetchIndiaNaturalEvents, type NayanNaturalEvent } from "../lib/data/eonet-natural-events";',
            'import { fetchIndiaNaturalEvents, type NayanNaturalEvent } from "../lib/data/eonet-natural-events";\nimport { fetchActiveSatellites, type NayanSatelliteRecord, propagateSatellite } from "../lib/data/satellites";'
          )
          text = text.replace(
            '    let naturalEventEntities: any[] = [];',
            '    let naturalEventEntities: any[] = [];\n    let satellitePoints: any = null;\n    let satelliteRecords = new Map<number, NayanSatelliteRecord>();\n    let satelliteRefreshTimer: number | null = null;\n    let satelliteAbortController: AbortController | null = null;'
          )
          text = text.replace(
            '    const clearNaturalEvents = () => {',
            '    const clearSatellites = () => {\n      if (!viewer || viewer.isDestroyed()) return;\n      if (satelliteRefreshTimer !== null) { window.clearInterval(satelliteRefreshTimer); satelliteRefreshTimer = null; }\n      if (satellitePoints) { viewer.scene.primitives.remove(satellitePoints); satellitePoints = null; }\n      satelliteRecords.clear();\n      viewer.scene.requestRender();\n    };\n\n    const clearNaturalEvents = () => {'
          )
          marker = '''\n\n    const showSatellites = async () => {\n      if (!viewer || viewer.isDestroyed() || !CesiumRef) return;\n      clearSatellites();\n      satelliteAbortController?.abort();\n      satelliteAbortController = new AbortController();\n\n      try {\n        const records = await fetchActiveSatellites(satelliteAbortController.signal);\n        if (cancelled || !viewer || viewer.isDestroyed()) return;\n\n        satelliteRecords = new Map(records.map((record) => [record.satellite.noradCatalogId, record]));\n        satellitePoints = viewer.scene.primitives.add(new CesiumRef.PointPrimitiveCollection());\n\n        const refresh = () => {\n          if (!satellitePoints || !viewer || viewer.isDestroyed()) return;\n          satellitePoints.removeAll();\n          const now = new Date();\n          for (const record of satelliteRecords.values()) {\n            const satellite = propagateSatellite(record, now);\n            if (!satellite) continue;\n            satellitePoints.add({\n              id: `nayan-satellite-${satellite.noradCatalogId}`,\n              position: CesiumRef.Cartesian3.fromDegrees(satellite.longitudeDeg, satellite.latitudeDeg, satellite.altitudeKm * 1000),\n              pixelSize: 6,\n              color: CesiumRef.Color.WHITE,\n              outlineColor: CesiumRef.Color.BLACK,\n              outlineWidth: 1,\n              disableDepthTestDistance: 0,\n              _nayanSatellite: satellite,\n            });\n          }\n          viewer.scene.requestRender();\n        };\n\n        refresh();\n        satelliteRefreshTimer = window.setInterval(refresh, 1000);\n        window.dispatchEvent(new CustomEvent("nayan:satellites-loaded", { detail: { count: records.length } }));\n      } catch (error) {\n        if ((error as Error)?.name === "AbortError") return;\n        console.error("NAYAN satellite layer failed:", error);\n        window.dispatchEvent(new CustomEvent("nayan:satellites-error", { detail: { message: "Unable to load satellite data." } }));\n      }\n    };\n'''
          text = text.replace('    const flyToEarthquake = (earthquake: NayanEarthquake) => {', marker + '\n    const flyToEarthquake = (earthquake: NayanEarthquake) => {')
          text = text.replace(
            '        const naturalEvent = picked?.id?._nayanNaturalEvent as NayanNaturalEvent | undefined;',
            '        const naturalEvent = picked?.id?._nayanNaturalEvent as NayanNaturalEvent | undefined;\n        const satellite = picked?.primitive?._nayanSatellite as ReturnType<typeof propagateSatellite> | undefined;'
          )
          text = text.replace(
            '        if (earthquake) {',
            '        if (satellite) {\n          viewer.camera.flyTo({\n            destination: CesiumRef.Cartesian3.fromDegrees(satellite.longitudeDeg, satellite.latitudeDeg, Math.max(120000, satellite.altitudeKm * 1000 + 80000)),\n            orientation: { heading: 0, pitch: CesiumRef.Math.toRadians(-90), roll: 0 },\n            duration: 1.35,\n            easingFunction: CesiumRef.EasingFunction.CUBIC_IN_OUT,\n          });\n          window.dispatchEvent(new CustomEvent("nayan:satellite-selected", { detail: { satellite, x: movement.position.x, y: movement.position.y } }));\n          return;\n        }\n\n        if (earthquake) {'
          )
          text = text.replace(
            '      const onNaturalEventsToggle = (event: Event) => {',
            '      const onSatellitesToggle = (event: Event) => {\n        const enabled = (event as CustomEvent<boolean>).detail;\n        if (enabled) void showSatellites();\n        else {\n          satelliteAbortController?.abort();\n          clearSatellites();\n          window.dispatchEvent(new CustomEvent("nayan:satellites-cleared"));\n        }\n      };\n\n      const onNaturalEventsToggle = (event: Event) => {'
          )
          text = text.replace(
            '      window.addEventListener("nayan:natural-events-toggle", onNaturalEventsToggle);',
            '      window.addEventListener("nayan:natural-events-toggle", onNaturalEventsToggle);\n      window.addEventListener("nayan:satellites-toggle", onSatellitesToggle);'
          )
          text = text.replace(
            '        window.removeEventListener("nayan:natural-events-toggle", onNaturalEventsToggle);',
            '        window.removeEventListener("nayan:natural-events-toggle", onNaturalEventsToggle);\n        window.removeEventListener("nayan:satellites-toggle", onSatellitesToggle);'
          )
          text = text.replace(
            '        naturalEventAbortController?.abort();',
            '        naturalEventAbortController?.abort();\n        satelliteAbortController?.abort();\n        clearSatellites();'
          )
          globe.write_text(text)

          page = Path('app/explore/page.tsx')
          text = page.read_text()
          text = text.replace(
            'import type { NayanNaturalEvent } from "../../lib/data/eonet-natural-events";',
            'import type { NayanNaturalEvent } from "../../lib/data/eonet-natural-events";\nimport type { NayanSatellite } from "../../lib/data/satellites";'
          )
          text = text.replace(
            'type NaturalEventSelection = { event: NayanNaturalEvent; x: number; y: number };',
            'type NaturalEventSelection = { event: NayanNaturalEvent; x: number; y: number };\ntype SatelliteSelection = { satellite: NayanSatellite; x: number; y: number };'
          )
          text = text.replace(
            '{ id: "satellites", label: "Satellites", detail: "ORBITAL OBJECTS", status: "demo", icon: "🛰️" },',
            '{ id: "satellites", label: "Satellites", detail: "ACTIVE ORBITAL OBJECTS", status: "live", icon: "🛰️" },'
          )
          text = text.replace(
            '  const [naturalEventCount, setNaturalEventCount] = useState<number | null>(null);',
            '  const [naturalEventCount, setNaturalEventCount] = useState<number | null>(null);\n  const [selectedSatellite, setSelectedSatellite] = useState<SatelliteSelection | null>(null);\n  const [satelliteCount, setSatelliteCount] = useState<number | null>(null);'
          )
          text = text.replace(
            '    const onNaturalEventSelected = (event: Event) => { setSelectedEarthquake(null); setSelectedNaturalEvent((event as CustomEvent<NaturalEventSelection>).detail); };',
            '    const onNaturalEventSelected = (event: Event) => { setSelectedEarthquake(null); setSelectedSatellite(null); setSelectedNaturalEvent((event as CustomEvent<NaturalEventSelection>).detail); };\n    const onSatelliteSelected = (event: Event) => { setSelectedEarthquake(null); setSelectedNaturalEvent(null); setSelectedSatellite((event as CustomEvent<SatelliteSelection>).detail); };'
          )
          text = text.replace(
            '    const onNaturalEventDeselected = () => setSelectedNaturalEvent(null);',
            '    const onNaturalEventDeselected = () => setSelectedNaturalEvent(null);\n    const onSatelliteDeselected = () => setSelectedSatellite(null);'
          )
          text = text.replace(
            '    const onNaturalEventsLoaded = (event: Event) => { setNaturalEventCount((event as CustomEvent<{ count: number }>).detail.count); setNotice("Natural events layer updated"); };',
            '    const onNaturalEventsLoaded = (event: Event) => { setNaturalEventCount((event as CustomEvent<{ count: number }>).detail.count); setNotice("Natural events layer updated"); };\n    const onSatellitesLoaded = (event: Event) => { setSatelliteCount((event as CustomEvent<{ count: number }>).detail.count); setNotice("Satellite layer updated"); };'
          )
          text = text.replace(
            '    const onNaturalEventsCleared = () => setSelectedNaturalEvent(null);',
            '    const onNaturalEventsCleared = () => setSelectedNaturalEvent(null);\n    const onSatellitesCleared = () => setSelectedSatellite(null);'
          )
          text = text.replace(
            '    window.addEventListener("nayan:natural-event-selected", onNaturalEventSelected);',
            '    window.addEventListener("nayan:natural-event-selected", onNaturalEventSelected);\n    window.addEventListener("nayan:satellite-selected", onSatelliteSelected);'
          )
          text = text.replace(
            '    window.addEventListener("nayan:natural-event-deselected", onNaturalEventDeselected);',
            '    window.addEventListener("nayan:natural-event-deselected", onNaturalEventDeselected);\n    window.addEventListener("nayan:satellite-deselected", onSatelliteDeselected);'
          )
          text = text.replace(
            '    window.addEventListener("nayan:natural-events-loaded", onNaturalEventsLoaded);',
            '    window.addEventListener("nayan:natural-events-loaded", onNaturalEventsLoaded);\n    window.addEventListener("nayan:satellites-loaded", onSatellitesLoaded);'
          )
          text = text.replace(
            '    window.addEventListener("nayan:natural-events-cleared", onNaturalEventsCleared);',
            '    window.addEventListener("nayan:natural-events-cleared", onNaturalEventsCleared);\n    window.addEventListener("nayan:satellites-cleared", onSatellitesCleared);'
          )
          text = text.replace(
            '      window.removeEventListener("nayan:natural-event-selected", onNaturalEventSelected);',
            '      window.removeEventListener("nayan:natural-event-selected", onNaturalEventSelected);\n      window.removeEventListener("nayan:satellite-selected", onSatelliteSelected);'
          )
          text = text.replace(
            '      window.removeEventListener("nayan:natural-event-deselected", onNaturalEventDeselected);',
            '      window.removeEventListener("nayan:natural-event-deselected", onNaturalEventDeselected);\n      window.removeEventListener("nayan:satellite-deselected", onSatelliteDeselected);'
          )
          text = text.replace(
            '      window.removeEventListener("nayan:natural-events-loaded", onNaturalEventsLoaded);',
            '      window.removeEventListener("nayan:natural-events-loaded", onNaturalEventsLoaded);\n      window.removeEventListener("nayan:satellites-loaded", onSatellitesLoaded);'
          )
          text = text.replace(
            '      window.removeEventListener("nayan:natural-events-cleared", onNaturalEventsCleared);',
            '      window.removeEventListener("nayan:natural-events-cleared", onNaturalEventsCleared);\n      window.removeEventListener("nayan:satellites-cleared", onSatellitesCleared);'
          )
          text = text.replace(
            '  const toggleLayer = (id: string) => {\n    if (id !== "earthquakes" && id !== "events") { setNotice("Demo control — this layer will become live when its data provider is connected."); return; }',
            '  const toggleLayer = (id: string) => {\n    if (!["earthquakes", "events", "satellites"].includes(id)) { setNotice("Demo control — this layer will become live when its data provider is connected."); return; }'
          )
          text = text.replace(
            'window.dispatchEvent(new CustomEvent(id === "earthquakes" ? "nayan:earthquakes-toggle" : "nayan:natural-events-toggle", { detail: enabling }));',
            'window.dispatchEvent(new CustomEvent(id === "earthquakes" ? "nayan:earthquakes-toggle" : id === "events" ? "nayan:natural-events-toggle" : "nayan:satellites-toggle", { detail: enabling }));'
          )
          marker = '''\n\n      {selectedSatellite && <aside className="earthquake-detail earthquake-detail--anchored" style={{ left: selectedSatellite.x > window.innerWidth / 2 ? Math.max(16, selectedSatellite.x - 356) : Math.min(Math.max(16, window.innerWidth - 356), selectedSatellite.x + 18), top: selectedSatellite.y > window.innerHeight / 2 ? Math.max(16, selectedSatellite.y - 292) : Math.min(Math.max(16, window.innerHeight - 292), selectedSatellite.y + 18), right: "auto", bottom: "auto", transform: "none", width: "min(340px, calc(100vw - 32px))" }}>\n        <div className="earthquake-detail-top"><div><span className="hub-eyebrow">NAYAN / SATELLITE</span><div className="earthquake-magnitude">🛰️</div></div><button className="earthquake-detail-close" onClick={() => setSelectedSatellite(null)} aria-label="Close satellite details">×</button></div>\n        <div className="earthquake-place">{selectedSatellite.satellite.name}</div><div className="earthquake-meta-grid"><div><span>NORAD</span><strong>{selectedSatellite.satellite.noradCatalogId}</strong></div><div><span>ALTITUDE</span><strong>{selectedSatellite.satellite.altitudeKm.toFixed(0)} KM</strong></div><div><span>SPEED</span><strong>{selectedSatellite.satellite.speedKmPerSecond.toFixed(2)} KM/S</strong></div><div><span>INCLINATION</span><strong>{selectedSatellite.satellite.inclinationDeg.toFixed(2)}°</strong></div></div>\n        <div className="earthquake-meta-grid"><div><span>LATITUDE</span><strong>{selectedSatellite.satellite.latitudeDeg.toFixed(2)}°</strong></div><div><span>LONGITUDE</span><strong>{selectedSatellite.satellite.longitudeDeg.toFixed(2)}°</strong></div><div><span>PERIOD</span><strong>{(1440 / selectedSatellite.satellite.meanMotionRevolutionsPerDay).toFixed(1)} MIN</strong></div><div><span>EPOCH</span><strong>{formatUtc(selectedSatellite.satellite.epoch)}</strong></div></div>\n        <a className="earthquake-source" href={`https://celestrak.org/NORAD/elements/?CATNR=${selectedSatellite.satellite.noradCatalogId}`} target="_blank" rel="noreferrer">OPEN CELESTRAK <span>↗</span></a>\n      </aside>}\n'''
          text = text.replace('      {selectedEarthquake &&', marker + '\n      {selectedEarthquake &&', 1)
          text = text.replace(
            '{naturalEventCount !== null && activeLayers.includes("events") && <div className="hub-live-summary"><span>INDIA REGION / NATURAL EVENTS</span><strong>{naturalEventCount} EVENTS LOADED</strong></div>}',
            '{naturalEventCount !== null && activeLayers.includes("events") && <div className="hub-live-summary"><span>INDIA REGION / NATURAL EVENTS</span><strong>{naturalEventCount} EVENTS LOADED</strong></div>}\n        {satelliteCount !== null && activeLayers.includes("satellites") && <div className="hub-live-summary"><span>ORBITAL CATALOG / ACTIVE</span><strong>{satelliteCount} SATELLITES LOADED</strong></div>}'
          )
          page.write_text(text)
          PY

      - name: Verify production build
        run: npm run build

      - name: Commit satellite integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json components/nayan-globe.tsx app/explore/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate satellite layer"
          git push

      - name: Remove integration workflow
        if: success()
        run: |
          git rm .github/workflows/build-satellite.yml
          git commit -m "Remove temporary satellite integration workflow"
          git push
