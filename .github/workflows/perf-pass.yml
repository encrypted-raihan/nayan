name: NAYAN performance pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-cesium:
    if: github.event.head_commit.message != 'Optimize Cesium render loop and 3D scene'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Cesium performance settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/nayan-globe.tsx')
          text = path.read_text()
          old = '''        selectionIndicator: false,\n        timeline: false,\n        shouldAnimate: false,\n        terrainProvider,'''
          new = '''        selectionIndicator: false,\n        timeline: false,\n        shouldAnimate: false,\n        scene3DOnly: true,\n        requestRenderMode: true,\n        maximumRenderTimeChange: Number.POSITIVE_INFINITY,\n        terrainProvider,'''
          if old not in text:
              raise SystemExit('Expected Cesium Viewer options were not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit performance pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/nayan-globe.tsx
          git commit -m "Optimize Cesium render loop and 3D scene"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/perf-pass.yml
          git commit -m "Remove temporary performance workflow"
          git push
